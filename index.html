<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Конструктор сервисного отчёта Alibaba.com — MD-INSIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6A00;
  --orange-d:#E85F00;
  --lav:#C5BCF1;
  --lav-l:#DAD4F6;
  --ink:#232930;
  --ui-bg:#12161c;
  --ui-bg2:#1a2029;
  --ui-line:#2c3543;
  --ui-txt:#e8edf4;
  --ui-mut:#8b98a9;
  --ui-accent:#FF6A00;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Montserrat','Golos Text','Inter','Segoe UI',Roboto,Arial,sans-serif;
  background:var(--ui-bg);color:var(--ui-txt);
  -webkit-font-smoothing:antialiased;
}

/* ============ APP SHELL ============ */
.app{display:flex;height:100vh;overflow:hidden}
#form{
  width:400px;min-width:400px;height:100%;overflow-y:auto;
  background:var(--ui-bg2);border-right:1px solid var(--ui-line);
  padding-bottom:80px;
}
#topbar{
  position:sticky;top:0;z-index:20;background:#0d1116;
  border-bottom:1px solid var(--ui-line);padding:14px 16px 12px;
}
#topbar h1{font-size:14px;font-weight:800;letter-spacing:.02em;line-height:1.3}
#topbar .sub{font-size:11px;color:var(--ui-mut);margin-top:4px;line-height:1.4}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button{
  font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;
  background:#242c38;color:var(--ui-txt);border:1px solid var(--ui-line);
  padding:7px 10px;border-radius:6px;transition:.15s;
}
button:hover{background:#2f3948;border-color:#3d4a5c}
button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
button.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
button.ghost{background:transparent}
.grp{border-bottom:1px solid var(--ui-line)}
.grp>summary{
  cursor:pointer;padding:12px 16px;font-size:12px;font-weight:800;
  letter-spacing:.03em;text-transform:uppercase;color:#cfd8e4;list-style:none;
  display:flex;align-items:center;gap:8px;
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:before{content:"▸";color:var(--ui-accent);font-size:11px;transition:.15s}
.grp[open]>summary:before{transform:rotate(90deg)}
.grp .body{padding:2px 16px 14px}
.f{margin-bottom:9px}
.f>label{display:block;font-size:10.5px;color:var(--ui-mut);margin-bottom:4px;line-height:1.35}
.f input[type=text],.f input[type=number],.f textarea,.f select{
  width:100%;font-family:inherit;font-size:12px;color:var(--ui-txt);
  background:#10151b;border:1px solid var(--ui-line);border-radius:5px;padding:6px 8px;
}
.f textarea{resize:vertical;min-height:58px;line-height:1.45}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--ui-accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:10px;color:var(--ui-mut);line-height:1.45;margin:6px 0 10px}
.hint b{color:#c3cddb}
table.mini{width:100%;border-collapse:collapse;margin-bottom:6px}
table.mini th{font-size:9px;color:var(--ui-mut);text-align:left;padding:0 4px 4px 0;font-weight:600}
table.mini td{padding:2px 3px 2px 0;vertical-align:top}
table.mini input,table.mini select,table.mini textarea{
  width:100%;font-family:inherit;font-size:11px;color:var(--ui-txt);
  background:#10151b;border:1px solid var(--ui-line);border-radius:4px;padding:4px 5px;
}
table.mini textarea{min-height:40px;resize:vertical;line-height:1.35}
.addbtn{font-size:10px;padding:5px 8px;margin-top:2px}
.pfx{display:flex;align-items:center;gap:3px;background:#10151b;border:1px solid var(--ui-line);border-radius:4px;padding:0 5px}
.pfx .ar{font-size:12px;line-height:1;flex:none;font-weight:700}
.pfx .sfx,.pfx .pre{font-size:11px;line-height:1;flex:none;color:var(--ui-mut);font-weight:700}
.pfx .sfx{padding-right:2px}
.pfx .pre{padding-left:2px}
.pfx .ar.up{color:#3ddc84}.pfx .ar.dn{color:#ff6b6b}.pfx .ar.flat{color:#8b98a9}
.pfx input{border:0 !important;background:transparent !important;padding:4px 0 !important;flex:1;min-width:0}
.genbtn{width:100%;font-size:11px;padding:8px 10px;margin:2px 0 8px;background:#2a3444;border-color:#3d4a5c;text-align:left}
.genbtn:hover{background:#354155;border-color:var(--ui-accent)}
.optblk{margin:10px 0 4px;border-top:1px dashed var(--ui-line);padding-top:9px}
.optblk>summary{cursor:pointer;font-size:10.5px;color:var(--ui-mut);list-style:none;display:flex;align-items:center;gap:6px;line-height:1.35}
.optblk>summary::-webkit-details-marker{display:none}
.optblk>summary:before{content:"\25B8";color:var(--ui-mut);font-size:10px;transition:.15s;flex:none}
.optblk[open]>summary:before{transform:rotate(90deg)}
.optbody{padding-top:9px;opacity:.9}
.imgdrop{
  border:1px dashed var(--ui-line);border-radius:6px;padding:10px;text-align:center;
  font-size:10px;color:var(--ui-mut);cursor:pointer;margin-bottom:8px;line-height:1.4;
}
.imgdrop:hover{border-color:var(--ui-accent);color:#c3cddb}
.imgdrop img{max-width:100%;max-height:70px;display:block;margin:0 auto 6px;border-radius:3px}
.imgdrop input{display:none}


/* блок пункта чек-листа (слайд 5) */
.svcblk{border:1px solid var(--ui-line);border-radius:6px;padding:9px 10px 10px;margin-bottom:10px;background:#151a21}
.svcblk .svchead{font-size:10px;font-weight:800;color:var(--ui-accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.svcblk label{display:block;font-size:10px;color:var(--ui-mut);margin:7px 0 3px}
.svcblk textarea,.svcblk select{width:100%;font-family:inherit;font-size:12px;color:var(--ui-txt);
  background:#10151b;border:1px solid var(--ui-line);border-radius:5px;padding:6px 8px;line-height:1.45}
.svcblk textarea{resize:vertical}
.svcblk textarea.svcmain{min-height:96px}
.svcblk textarea.svcnote{min-height:54px}
.svcblk textarea:focus,.svcblk select:focus{outline:none;border-color:var(--ui-accent)}

/* ============ PREVIEW ============ */
#preview{flex:1;overflow-y:auto;padding:24px;background:#20262f}
#stage{width:1280px;transform-origin:top left}
#stagewrap{position:relative}
.slide{
  width:1280px;height:720px;position:relative;overflow:hidden;
  margin:0 0 26px;box-shadow:0 10px 34px rgba(0,0,0,.45);background:#fff;
  color:#fff;
}
.slide.orange{background:var(--orange)}
.slide.lav{background:var(--lav);color:var(--ink)}
.pad{position:absolute;left:70px;right:70px;top:54px;bottom:104px}

/* typography */
.h1{font-style:italic;font-weight:900;text-transform:uppercase;line-height:.97;letter-spacing:-.01em}
.t-orange .h1,.slide.orange .h1{color:#fff}
.slide.lav .h1{color:#fff}
.slide.lav .h1.dark{color:var(--ink)}
.hr{border:0;border-top:2px solid currentColor;opacity:.55;margin:16px 0 0}
.dhr{border:0;border-top:1px dotted currentColor;opacity:.55;margin:14px 0 0}
.bodytxt{font-style:italic;font-weight:600;font-size:16px;line-height:1.42}
.small{font-style:italic;font-weight:600;font-size:11.5px;line-height:1.42}
.tiny{font-style:italic;font-weight:600;font-size:10px;line-height:1.4}

/* footer */
.foot{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;align-items:center;justify-content:center}
.foot.bar{background:var(--orange)}
.foot .bars{
  position:absolute;left:0;bottom:0;width:420px;height:96px;
  background:
    repeating-linear-gradient(-33deg,var(--lav) 0 13px,transparent 13px 30px);
  opacity:.95;
}
.foot.stripes{background:#fff}
.foot.stripes .bars{
  position:absolute;left:0;bottom:0;width:520px;height:96px;opacity:.9;
  background:repeating-linear-gradient(-33deg,var(--lav) 0 12px,rgba(255,255,255,.85) 12px 26px);
  -webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 100%);
          mask-image:linear-gradient(90deg,#000 55%,transparent 100%);
}
.logos{display:flex;align-items:center;gap:14px;position:relative;z-index:2}
.slide.orange .foot .logos{color:var(--orange)}
.foot.bar .logos{color:#fff}
.slide.lav .foot .logos{color:var(--orange)}
.ali{display:flex;align-items:center;gap:7px;font-style:italic;font-weight:800;font-size:21px;letter-spacing:-.02em}
.ali img{height:26px;display:block}
.gsp{font-size:11px;font-style:italic;font-weight:600;line-height:1.15;opacity:.95}
.md{font-style:italic;font-weight:900;font-size:23px;letter-spacing:.01em}
.md img{height:26px;display:block}
.vline{width:2px;height:34px;background:currentColor;opacity:.6}

/* cover */
.cover-brand{position:absolute;right:70px;bottom:96px;text-align:right}
.minibadge{position:absolute;right:148px;top:224px;width:226px;height:226px}
.minibadge img,.minibadge svg{width:100%;height:100%;object-fit:contain;display:block}
.minibadge a{display:block;width:100%;height:100%}
.cover-deco{
  position:absolute;left:16px;bottom:0;width:430px;height:180px;opacity:.85;
  background:repeating-linear-gradient(-33deg,#fff 0 9px,transparent 9px 24px);
  -webkit-mask-image:radial-gradient(115% 130% at 0% 100%,#000 34%,transparent 80%);
          mask-image:radial-gradient(115% 130% at 0% 100%,#000 34%,transparent 80%);
}
.cover-grid{display:grid;grid-template-columns:auto auto;gap:10px 46px;margin-top:26px;position:relative;z-index:3}
.cover-grid .lbl{font-size:14px;font-style:italic;font-weight:600;line-height:1.35;opacity:.95}
.cover-grid .val{font-size:21px;font-style:italic;font-weight:800;line-height:1.35}

/* metric strip (slide 6) */
.strip{background:#fff;border-radius:3px;padding:14px 8px;display:grid}
.tile{padding:2px 16px;border-right:1px solid #e6e9f0}
.tile:last-child{border-right:0}
.tile .tl{font-size:12.5px;color:#4a5568;font-weight:600}
.tile .tv{font-size:29px;color:#1f2b45;font-weight:800;margin-top:8px;letter-spacing:-.01em}
.tile .td{font-size:11.5px;color:#8a94a6;margin-top:5px;font-weight:600}
.up{color:#1f9d55}.dn{color:#e04f4f}

/* geography table */
.geo{background:#fff;border-radius:3px;padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
.geo h4{font-size:13px;color:#1f2b45;font-weight:700;margin-bottom:10px}
.grow{display:grid;grid-template-columns:16px 20px 1fr 122px 52px;align-items:center;gap:7px;font-size:12px;color:#2c3752;margin-bottom:8px}
.grow.s{grid-template-columns:16px 1fr 122px 52px}
.grow .n{color:#9aa3b4;font-weight:700}
.gbar{height:11px;border-radius:2px;background:linear-gradient(90deg,#7b61ff,#9b8bff)}
.grow .p{text-align:right;font-weight:700;color:#1f2b45}
.gvline{width:1px;background:#e6e9f0}

/* chart */
.chart{position:relative;height:150px;margin-top:8px}
.chart .yax{position:absolute;left:0;top:0;bottom:18px;width:26px;font-size:9px;color:#8a94a6;display:flex;flex-direction:column;justify-content:space-between}
.chart .xax{position:absolute;left:26px;right:0;bottom:0;height:18px;display:flex;justify-content:space-between;font-size:9px;color:#8a94a6}

/* checklist tables */
table.ck{width:100%;border-collapse:collapse}
table.ck td{border-bottom:1px solid rgba(255,255,255,.55);padding:11px 14px;vertical-align:middle;font-style:italic;font-weight:600}
table.ck tr:first-child td{border-top:1px solid rgba(255,255,255,.55)}
table.ck td.lab{width:64%;font-size:15px;line-height:1.32}
table.ck td.mk{width:9%;text-align:center;font-size:34px;font-weight:400;font-style:normal;line-height:1}
table.ck td.note{font-size:13px;text-align:center;line-height:1.3}
table.ck td.vline{border-left:1px solid rgba(255,255,255,.55);padding:0;width:0}

table.op3{width:100%;border-collapse:collapse;margin-top:6px}
table.op3 th{
  font-size:14px;font-style:italic;font-weight:700;text-align:left;
  padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.6);vertical-align:top;line-height:1.3;
}
table.op3 td{font-size:22px;font-weight:500;font-style:italic;padding:16px;border-bottom:1px solid rgba(255,255,255,.6)}

/* online activity grid */
.act{display:grid;grid-template-columns:repeat(4,1fr);margin-top:6px}
.act .c{padding:26px 18px 0;border-left:1px dotted rgba(255,255,255,.75);min-height:132px}
.act .c:first-child{border-left:0}
.act .c .th{font-size:15px;font-style:italic;font-weight:700;line-height:1.3}
.act .c .vl{font-size:41px;font-weight:500;font-style:italic;margin-top:16px;letter-spacing:-.01em}
.notes4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px}
.notes4 .n{padding:0 18px;border-left:1px dotted rgba(255,255,255,.75);font-size:10.5px;font-style:italic;font-weight:600;line-height:1.4}
.notes4 .n:first-child{border-left:0}

/* rating rows */
.rrow{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.6)}
.rrow>div{padding:13px 4px;font-size:16px;font-style:italic;font-weight:700}
.rrow .lab{color:#fff}
.rrow .val{font-weight:500}
.rhead{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid rgba(255,255,255,.6)}
.rhead>div{padding:8px 4px 14px;font-size:16px;font-style:italic;font-weight:700}
.rhead .big{font-size:38px;font-weight:500;font-style:italic;vertical-align:-4px;padding-left:10px}

/* indicator boxes */
.ind{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.indrow{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.indrow .lab{font-size:16px;font-style:italic;font-weight:700;line-height:1.25;flex:1}
.indrow .box{border:1px solid rgba(255,255,255,.85);padding:7px 22px;font-size:25px;font-style:italic;font-weight:500;min-width:150px;text-align:center}

/* recommendation list */
.rec .item{margin-bottom:17px}
.rec .ttl{font-size:16px;font-weight:800;font-style:normal;margin-bottom:6px}
.rec .txt{font-size:13.5px;font-weight:600;line-height:1.45}

/* marketing slides */
.mkt{display:grid;grid-template-columns:1fr 1.05fr;gap:34px;align-items:center}
.mkt h3{font-size:15px;font-style:italic;font-weight:800;margin:16px 0 6px;color:var(--ink)}
.mkt .def{font-size:14px;font-style:italic;font-weight:700;line-height:1.4;color:var(--ink)}
.mkt ul{list-style:none;font-size:12.5px;font-style:italic;font-weight:600;line-height:1.5;color:var(--ink)}
.mkt ul li{position:relative;padding-left:14px}
.mkt ul li:before{content:"-";position:absolute;left:0}
.mkt .pr{font-size:13.5px;font-style:italic;font-weight:700;line-height:1.55;color:var(--ink)}
.mkt .ic{display:inline-block;width:26px;font-size:19px;font-weight:800;color:var(--ink);vertical-align:-3px}
.shot{
  width:100%;height:318px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#d8d2f7,#efeafd);color:#7a7397;font-size:12px;text-align:center;padding:20px;
  border:2px dashed #b7aee6;
}
.shot img{max-width:100%;max-height:100%;border-radius:6px;display:block}
.shot.plain{background:#f4f2fb;border-style:solid;border-color:#e2ddf6}


/* слайды 7–9 (RFQ / KWA / ADS): заголовок, линия, текстовая колонка слева, иллюстрация справа.
   Иллюстрации вырезаны из исходного отчёта вместе с отрезком линии: линия на иллюстрации
   (y = 118 px, конец x = 1210 px) продолжает линию слайда, а белая кромка внизу сливается с подвалом. */
.mkttitle{position:absolute;left:70px;right:70px;top:34px;height:72px;display:flex;align-items:flex-end;
  font-size:30px;line-height:1.02;letter-spacing:-.005em}
.mkthr{position:absolute;left:70px;width:1140px;top:116.5px;height:3px;margin:0;border:0;background:#232930;opacity:1;z-index:3}
.mktimg{position:absolute;left:634.5px;top:104.9px;width:684.4px;height:530px;z-index:1;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 46px);mask-image:linear-gradient(90deg,transparent 0,#000 46px)}
.mktimg img{display:block;width:100%;height:100%}
.mktcol{position:absolute;left:70px;top:146px;width:524px;color:var(--ink);z-index:2}
.mktcol .def{font-size:15.5px;font-style:italic;font-weight:700;line-height:1.4}
.mktcol h3{font-size:16.5px;font-style:italic;font-weight:800;margin:18px 0 7px}
.mktcol ul{list-style:none;font-size:14px;font-style:italic;font-weight:600;line-height:1.5}
.mktcol ul li{position:relative;padding-left:14px}
.mktcol ul li:before{content:"-";position:absolute;left:0}
.mktcol .pr{font-size:15px;font-style:italic;font-weight:700;line-height:1.55}
.mktcol .ic{display:inline-block;width:26px;flex:none;font-size:20px;font-weight:800;vertical-align:-3px}

/* contacts */
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
.clist{font-size:15px;font-style:italic;font-weight:700;line-height:1.9;color:var(--ink)}
.clist .lbl{font-weight:600}
.qrs{display:flex;gap:26px;justify-content:flex-end}
.qrc{position:relative;width:170px}
.qrc .badge{
  position:absolute;left:50%;transform:translateX(-50%);top:-17px;width:38px;height:38px;border-radius:50%;
  background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
}
.qrc .code{width:170px;height:170px;background:#fff;padding:9px}
.qrc .code img,.qrc .code svg{width:100%;height:100%;display:block}

/* ============ ИТОГИ МЕСЯЦА / ПОКАЗАТЕЛИ И ДИНАМИКА ============ */
.sub2{font-size:15px;font-style:italic;font-weight:600;line-height:1.35;margin-top:9px;color:#fff;opacity:.95}
.slide.lav .sub2{color:var(--ink);opacity:.9}
.sec2{font-size:16px;font-style:italic;font-weight:800;color:#fff;margin:20px 0 9px}
.slide.lav .sec2{color:var(--ink)}
.vbox{
  background:#fff;border-left:6px solid var(--lav);border-radius:4px;
  padding:15px 20px;font-size:14.5px;font-style:italic;font-weight:600;line-height:1.45;color:var(--ink);
}
.ctable{display:grid;border-radius:4px;overflow:hidden;background:#fff}
.ctable .ch{background:var(--lav);color:var(--ink);font-size:13px;font-weight:800;font-style:italic;padding:9px 13px;line-height:1.25}
.ctable .cr{background:#fff;color:var(--ink);font-size:13.5px;font-style:italic;font-weight:600;padding:9px 13px;line-height:1.3;border-bottom:1px solid #eef0f5}
.ctable .cr.alt{background:#F7F8FA}
.ctable .cr .up{color:#1f9d55;font-weight:800}
.ctable .cr .dn{color:#e04f4f;font-weight:800}
.ctable .cr .flat{color:#8a94a6;font-weight:800}
.flat{color:#8a94a6}
.cblk{display:flex;gap:52px}
.cblk .lbl{font-size:14px;font-style:italic;font-weight:600;line-height:1.35;opacity:.95}
.cblk .val{font-size:21px;font-style:italic;font-weight:800;line-height:1.35;margin-top:6px}
.bul{list-style:none;margin-top:2px}
.bul li{position:relative;padding-left:18px;font-size:14px;font-style:italic;font-weight:600;line-height:1.5;
        margin-bottom:5px;color:#fff}
.bul li:before{content:"\2022";position:absolute;left:1px;color:var(--lav);font-weight:800}

/* ============ РЕКОМЕНДАЦИИ ============ */
.rsub{font-size:14px;font-style:italic;font-weight:600;color:var(--ink);opacity:.72;margin-top:8px}
.reclist{margin-top:26px}
.ritem{display:flex;align-items:flex-start;gap:22px;margin-bottom:26px}
.rnum{flex:none;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;font-style:italic}
.rbody{flex:1}
.rtitle{font-size:20px;font-weight:800;color:var(--ink);line-height:1.25}
.rwhy{font-size:14px;font-weight:600;font-style:italic;color:#5b6577;margin-top:6px;line-height:1.35}

}

function get(p){ return p.split(".").reduce((a,k)=>a==null?a:a[k], D); }
function set(p,v){
  const ks=p.split("."); const last=ks.pop();
  const o=ks.reduce((a,k)=>(a[k]=a[k]||{}), D);
  o[last]=v;
}

function fieldHTML(k,l,t){
  const v = get(k)==null?"":get(k);
  if(t==="check")
    return `<div class="f"><label><input type="checkbox" data-k="${k}" ${v?"checked":""} style="width:auto;margin-right:6px;vertical-align:-2px">${l}</label></div>`;
  if(t==="img"){
    const img = v?`<img src="${v}">`:"";
    return `<div class="f"><label>${l}</label><div class="imgdrop" onclick="this.querySelector('input').click()">
      ${img}<span>${v?"Заменить изображение":"Нажмите, чтобы загрузить PNG/JPG"}</span>
      <input type="file" accept="image/*" data-img="${k}"></div></div>`;
  }
  if(t==="area") return `<div class="f"><label>${l}</label><textarea data-k="${k}">${esc(v)}</textarea></div>`;
  if(t==="btn")  return `<div class="f"><button class="genbtn" data-btn="${k}">${l}</button></div>`;
  return `<div class="f"><label>${l}</label><input type="text" data-k="${k}" value="${esc(v)}"></div>`;
}
function tableHTML(tk){
  if(tk==="gen.events" || tk==="gen.notes"){
    const isEv = tk==="gen.events";
    const list = isEv ? genEvents() : genNotes();
    const prev = list.map(x=>esc(isEv?x[0]:x)).join(" · ");
    return `<div class="f"><button class="genbtn" data-btn="${tk}">Сгенерировать ${list.length} `+
      `${isEv?"события в таблицу":"пояснения в список"} выше →</button>`+
      `<div class="hint">Предпросмотр: ${prev}</div></div>`;
  }
  if(tk==="service.rows") return serviceHTML();
  const s = TBL[tk]; const arr = get(tk);
  const isStr = TEXTARR.has(tk);
  let h = `<div class="f"><label>${s.label}</label><table class="mini"><thead><tr>`;
  if(!isStr) s.cols.forEach(c=>h+=`<th>${c[1]}</th>`);
  h+=`</tr></thead><tbody>`;
  (arr||[]).forEach((row,i)=>{
    h+=`<tr>`;
    if(isStr){
      h+=`<td><input type="text" data-t="${tk}" data-i="${i}" data-c="0" value="${esc(row)}"></td>`;
    }else{
      s.cols.forEach((c,ci)=>{
        const val = row[ci]==null?"":row[ci];
        if(c[2]==="area") h+=`<td><textarea data-t="${tk}" data-i="${i}" data-c="${ci}">${esc(val)}</textarea></td>`;
        else if(c[2]==="arrow"){
          const a = (c[3]==="sign") ? arrowBySign(val) : arrowByTrend(row[c[3]]);
          const af=fieldAffix(tk,ci,row);
          h+=`<td><div class="pfx"><span class="ar ${a.cls}">${a.ch}</span>${af.pre?`<span class="pre">${af.pre}</span>`:""}<input type="text" data-t="${tk}" data-i="${i}" data-c="${ci}" value="${esc(val)}">${af.suf?`<span class="sfx">${af.suf}</span>`:""}</div></td>`;
        }
        else if(c[2]==="select"){
          h+=`<td><select data-t="${tk}" data-i="${i}" data-c="${ci}">`;
          c[3].forEach(o=>h+=`<option value="${esc(o[0])}" ${String(val)===String(o[0])?"selected":""}>${o[1]}</option>`);
          h+=`</select></td>`;
        }
        else {
          const af=fieldAffix(tk,ci,row);
          h+=`<td><div class="pfx">${af.pre?`<span class="pre">${af.pre}</span>`:""}<input type="text" data-t="${tk}" data-i="${i}" data-c="${ci}" value="${esc(val)}">${af.suf?`<span class="sfx">${af.suf}</span>`:""}</div></td>`;
        }
      });
    }
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  if(!s.noAdd) h+=`<button class="addbtn" data-add="${tk}">+ Добавить строку</button>`;
  h+=`</div>`;
  return h;
}
/* слайд 5: каждый пункт — отдельный блок; комментарий расположен под пунктом */
function serviceHTML(){
  const s=TBL["service.rows"], arr=get("service.rows")||[];
  let h=`<div class="f"><label>${s.label}</label>`;
  arr.forEach((row,i)=>{
    const v=c=>esc(row[c]==null?"":row[c]);
    h+=`<div class="svcblk"><div class="svchead">Пункт ${i+1}</div>
      <label>Пункт</label>
      <textarea class="svcmain" data-t="service.rows" data-i="${i}" data-c="0">${v(0)}</textarea>
      <label>+ / −</label>
      <select data-t="service.rows" data-i="${i}" data-c="1">`;
    s.cols[1][3].forEach(o=>h+=`<option value="${esc(o[0])}" ${String(row[1]==null?"":row[1])===String(o[0])?"selected":""}>${o[1]}</option>`);
    h+=`</select>
      <label>Комментарий</label>
      <textarea class="svcnote" data-t="service.rows" data-i="${i}" data-c="2">${v(2)}</textarea></div>`;
  });
  h+=`<button class="addbtn" data-add="service.rows">+ Добавить строку</button></div>`;
  return h;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderForm(){
  let h="";
  GROUPS.forEach(([title,fields,tables],gi)=>{
    h+=`<details class="grp" ${gi<2?"open":""}><summary>${esc(title)}</summary><div class="body">`;
    if(gi===5) h+=`<div class="hint">Эти значения используются только при включённой автогенерации рекомендаций.</div>`;
    if(gi===6) h+=`<div class="hint">Слайд 10 необязателен: снимите галочку — и он не попадёт в отчёт и в PDF. Контакты (e-mail, телефон, сайт, Telegram, VK) заполняются в блоке «1. Клиент и период» → «Опциональные поля». Логотипы подставляются в подвалы всех слайдов — независимо от того, показан ли слайд 10.</div>`;
    const req=[], opt=[];
    fields.forEach(f=>(OPTIONAL.has(f[0])?opt:req).push(f));
    req.forEach(([k,l,t])=>{ if(t) h+=fieldHTML(k,l,t); });
    if(opt.length){
      h+=`<details class="optblk"><summary>Опциональные поля — заполняются по необходимости</summary><div class="optbody">`;
      opt.forEach(([k,l,t])=>{ if(t) h+=fieldHTML(k,l,t); });
      h+=`</div></details>`;
    }
    tables.forEach(([tk])=>{ h+=tableHTML(tk); });
    h+=`</div></details>`;
  });
  document.getElementById("formbody").innerHTML=h;
}

document.getElementById("form").addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.k!==undefined){
    if(el.type==="checkbox") set(el.dataset.k, el.checked);
    else set(el.dataset.k, el.value);
    schedule();
  }
  if(el.dataset.t!==undefined){
    const tk=el.dataset.t, i=+el.dataset.i, c=+el.dataset.c;
    let v=el.value;
    const spec=TBL[tk] && TBL[tk].cols[c];
    const af=fieldAffix(tk,c,get(tk)[i]||[]);
    if(spec && (spec[2]==="arrow" || af.pre || af.suf)){  /* значок и суффикс неудаляемы: в поле только число */
      v=cleanNum(v);
      if(el.value!==v) el.value=v;
    }
    if(TEXTARR.has(tk)) get(tk)[i]=v;
    else get(tk)[i][c]=v;
    schedule();
    if(el.tagName==="SELECT") renderForm();  /* обновить значок у поля «Динамика» */
  }
});
document.getElementById("form").addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.img!==undefined && el.files && el.files[0]){
    const r=new FileReader();
    r.onload=()=>{ set(el.dataset.img, r.result); renderForm(); schedule(); };
    r.readAsDataURL(el.files[0]);
  }
});
document.getElementById("form").addEventListener("click",e=>{
  const add=e.target.dataset && e.target.dataset.add;
  if(add){
    const s=TBL[add];
    const blankRow = TEXTARR.has(add) ? "" : s.cols.map(()=>"");
    get(add).push(blankRow);
    renderForm(); schedule();
  }
  const btn=e.target.dataset && e.target.dataset.btn;
  if(btn==="gen.verdict"){ D.summary.verdict=genVerdict(); D.summary.verdictAuto=false; renderForm(); render(); }
  if(btn==="gen.events"){  D.summary.events=genEvents();   D.summary.eventsAuto=false;  renderForm(); render(); }
  if(btn==="gen.notes"){   D.dynamics.notes=genNotes();    D.dynamics.notesAuto=false;  renderForm(); render(); }
  if(btn==="gen.priority"){ D.rec.priority=genPriority();  D.rec.auto=false;            renderForm(); render(); }
});

const nl = s => esc(s).replace(/\n/g,"<br>");
/* строку можно добавить, но не удалить: пустые хвостовые строки просто не выводятся */
const isEmptyRow = r => Array.isArray(r) ? r.every(x=>!String(x==null?"":x).trim()) : !String(r==null?"":r).trim();
function liveRows(arr){
  const a=(arr||[]).slice();
  while(a.length && isEmptyRow(a[a.length-1])) a.pop();
  return a;
}
function num(v){
  if(v==null) return NaN;
  const s=String(v).replace(/\s|\u00A0/g,"").replace(",",".").replace(/[^\d.\-]/g,"");
  const n=parseFloat(s); return isNaN(n)?NaN:n;
}
function frac(v){
  const m=String(v==null?"":v).match(/(\d+(?:[.,]\d+)?)\s*\/\s*(\d+)/);
  return m?parseFloat(m[1].replace(",",".")):num(v);
}
function pct(v){ const n=num(v); if(isNaN(n)) return String(v||"");
  return (Math.round(n*100)/100).toString().replace(".",",")+"%"; }
function aliSVG(){ return `<svg viewBox="0 0 40 30" width="30" height="23" fill="none" stroke="currentColor" stroke-width="3.6"><circle cx="20" cy="11" r="7.6"/><path d="M5 25.5c9.6 5.4 20.4 5.4 30 0" stroke-linecap="round"/></svg>`; }
function qrSVG(seed){
  let h=2166136261; const S=String(seed||"x");
  for(let i=0;i<S.length;i++){ h^=S.charCodeAt(i); h=Math.imul(h,16777619); }
  const rnd=()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1000)/1000; };
  const n=21, cs=100/n;
  const finder=(x,y)=>`<rect x="${x*cs}" y="${y*cs}" width="${cs*7}" height="${cs*7}" fill="#111"/>`+
    `<rect x="${(x+1)*cs}" y="${(y+1)*cs}" width="${cs*5}" height="${cs*5}" fill="#fff"/>`+
    `<rect x="${(x+2)*cs}" y="${(y+2)*cs}" width="${cs*3}" height="${cs*3}" fill="#111"/>`;
  let r="";
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)) continue;
    if(rnd()>0.52) r+=`<rect x="${x*cs}" y="${y*cs}" width="${cs}" height="${cs}" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}${r}</svg>`;
}
const fmt = n => isNaN(n)?"":String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
/* в поле вводится только число; «%» и «/5» подставляются системой */
function cleanNum(v){
  return String(v==null?"":v)
    .replace(/[\u2191\u2193\u25B2\u25BC\u25B3\u25BD\u2197\u2198\u2192]/g,"")
    .replace(/[%$]/g,"").replace(/\/\s*5/g,"").trim();
}
function deltaText(v){ return String(cleanNum(v)).replace(/^[-\u2212]/,""); }
const affixed=(pre,val,suf)=>esc(pre)+(pre?" ":"")+esc(val)+esc(suf);
function fieldAffix(tk,ci,row){
  const name=String((row&&row[0])||"");
  const isRate=/star|рейтинг|rating/i.test(name);
  const isKwa =/kwa/i.test(name);
  let pre="",suf="";
  if(tk==="summary.cards"){
    if(ci===1 && isRate) suf="/5";
    if(ci===1 && isKwa)  pre="$";
    if(ci===2) suf="%";
  }
  if(tk==="dynamics.rows"){
    if(isRate && (ci===1||ci===2)) suf="/5";
    if(isKwa  && (ci===1||ci===2)) pre="$";
    if(ci===3) suf="%";
  }
  return {pre,suf};
}
function suffixFor(tk,ci,row){
  const name=String((row&&row[0])||"");
  const isRate=/star|рейтинг|rating/i.test(name);
  if(tk==="summary.cards"){
    if(ci===1 && isRate) return "/5";      /* значение плитки Star Rating */
    if(ci===2) return "%";                 /* динамика — всегда в процентах */
  }
  if(tk==="dynamics.rows"){
    if(isRate && (ci===1||ci===2)) return "/5";
    if(ci===3) return "%";
  }
  return "";
}
function cleanDelta(v){ return String(v==null?"":v).replace(/[\u2191\u2193\u25B2\u25BC\u25B3\u25BD\u2197\u2198\u2192]/g,"").replace(/^\s+/,""); }
function arrowByTrend(t){
  if(t==="up")   return {ch:"\u2191",cls:"up"};
  if(t==="dn")   return {ch:"\u2193",cls:"dn"};
  return {ch:"\u25B2",cls:"flat"};
}
function arrowBySign(v){
  const s=String(v==null?"":v);
  if(/[-\u2212]/.test(s)) return {ch:"\u2193",cls:"dn"};
  const d=s.replace(/[^\d.,]/g,"");
  if(d && /[1-9]/.test(d)) return {ch:"\u2191",cls:"up"};
  return {ch:"\u25B2",cls:"flat"};
}
/* сводные метрики из слайдов 2–3: используются и в рекомендациях, и в генерации текста */
function metrics(){
  const cards=liveRows(D.summary.cards), rows=liveRows(D.dynamics.rows);
  const row  = re => rows.find(r=>re.test(String(r[0]||""))) || [];
  const card = re => cards.find(c=>re.test(String(c[0]||""))) || [];
  const v = re => { const r=row(re); return !isNaN(num(r[1])) ? num(r[1]) : num(card(re)[1]); };
  const pv = re => num(row(re)[2]);
  const rt = (()=>{ const a=frac(row(/star|рейтинг|rating/i)[1]); return isNaN(a)?frac(card(/star|рейтинг/i)[1]):a; })();
  return {
    views:v(/view|просмотр/i), viewsPrev:pv(/view|просмотр/i),
    inq:v(/inquir|запрос/i), rfq:v(/rfq|кп/i),
    resp:num(row(/response|ответ|реакц/i)[1]), respRaw:String(row(/response|ответ|реакц/i)[1]||""),
    rating:rt, kwa:num(row(/kwa|реклам/i)[1]),
    kwaRaw:String(row(/kwa|реклам/i)[1]||card(/kwa/i)[1]||""),
    budget:num(D.summary.budget)
  };
}
const pctChange = (cur,prev) => (prev>0 && !isNaN(cur) && !isNaN(prev)) ? Math.round((cur-prev)/prev*1000)/10 : NaN;
function mon(n){ return isNaN(n) ? "0 $" : fmt(Math.round(n*100)/100)+" $"; }



/* ---------- пояснения к слайду «Показатели и динамика» ---------- */
function changePct(cur,prev){
  if(isNaN(cur)||isNaN(prev)||prev===0) return NaN;
  return Math.round((cur-prev)/prev*1000)/10;
}
function dynItems(){
  return liveRows(D.dynamics.rows).map(r=>{
    const cur=num(r[1]), prev=num(r[2]);
    return {name:String(r[0]||"").trim(), curRaw:String(r[1]||"").trim(), prevRaw:String(r[2]||"").trim(),
            cur:isNaN(cur)?null:cur, prev:isNaN(prev)?null:prev, ch:changePct(cur,prev)};
  });
}
const RESP=/response|ответ|реакц/i;
function dynCause(name,ch){
  const down = ch<0;
  if(/view|просмотр/i.test(name))     return down ? "снижение показов в поисковой выдаче или сезонный спад спроса"
                                                 : "рост показов в поиске и расширение охвата аудитории";
  if(/inquir|запрос/i.test(name))     return down ? "трафик не конвертируется в обращения — карточки и скорость ответа"
                                                 : "улучшение конверсии витрины и работа с входящими";
  if(/rfq|кп/i.test(name))            return down ? "сокращение рассылки КП на тендерной площадке"
                                                 : "активная работа с квотами RFQ";
  if(RESP.test(name))                 return down ? "ускорение обработки входящих обращений"
                                                 : "замедление реакции на запросы покупателей";
  if(/star|рейтинг|rating/i.test(name)) return down ? "просадка показателей товарных позиций или сервиса"
                                                    : "рост качества карточек и сервиса";
  if(/kwa|реклам/i.test(name))        return down ? "сокращение или остановка рекламного продвижения"
                                                  : "запуск и расширение рекламных кампаний";
  return down ? "снижение активности по этому направлению" : "рост активности по этому направлению";
}
function genNotes(){
  const items=dynItems(), out=[];
  const withCh=items.filter(i=>!isNaN(i.ch));
  const m=metrics(), q=num(D.rec.quotasMin)||14, qM=num(D.rec.quotasMonth)||40;
  /* десятичный разделитель: меняем только точку между цифрами, чтобы не портить «0,01 ч.» */
  const pr=v=> v==null ? "н/д" : String(v).trim().replace(/(\d)\.(\d)/g,"$1,$2");

  /* изменение трактуем как улучшение (+) или ухудшение (−): для времени ответа рост — это минус */
  const scored=withCh.map(i=>({i, score: RESP.test(i.name) ? -i.ch : i.ch}));
  let top=null;

  /* 1. ключевой показатель и возможная причина — в первую очередь просевший */
  if(scored.length){
    const worst=scored.filter(x=>x.score<=0).sort((a,b)=>a.score-b.score)[0];
    top = worst ? worst.i : scored.slice().sort((a,b)=>Math.abs(b.i.ch)-Math.abs(a.i.ch))[0].i;
    const abs=Math.abs(top.ch).toString().replace(".",",");
    out.push(top.name+": "+pr(top.curRaw||top.cur)+" против "+pr(top.prevRaw||top.prev)+" — "+
      (top.ch>0?"рост":"снижение")+" на "+abs+"%. Возможная причина — "+dynCause(top.name,top.ch)+".");
  }else{
    const any=items.find(i=>i.cur!==null);
    out.push(any ? any.name+" за период — "+pr(any.curRaw||any.cur)+". Данные за предыдущий месяц не заполнены, динамика не рассчитана."
                 : "Нет данных для расчёта динамики — заполните показатели за текущий и предыдущий месяц.");
  }

  /* 2. что сработало — лучший прирост, не повторяя показатель из пункта 1 */
  const ranked=scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  const good=ranked.find(x=>x.i!==top) || null;
  if(good){
    const abs=Math.abs(good.i.ch).toString().replace(".",",");
    out.push("Что сработало: "+good.i.name+" — "+(RESP.test(good.i.name)?"время сократилось":"показатель вырос")+
      " на "+abs+"% к прошлому месяцу ("+pr(good.i.curRaw||good.i.cur)+" против "+pr(good.i.prevRaw||good.i.prev)+").");
  }else if(!isNaN(m.resp) && m.resp<=2){
    out.push("Что сработало: сервис отработал в срок — среднее время ответа "+(m.respRaw||"в пределах нормы")+" при целевом значении ≤ 2 ч.");
  }else{
    out.push("Что сработало: выраженной положительной динамики за период нет — показатели на прежнем уровне или снижаются.");
  }

  /* 3. что требует дополнительной проверки */
  if(!isNaN(m.views) && m.views>0 && !(m.inq>0))
    out.push("Требует проверки: нулевая конверсия витрины — при "+fmt(m.views)+" просмотрах запросов нет. Сверить карточки, цену и MOQ.");
  else if(!isNaN(m.rfq) && m.rfq<q)
    out.push("Требует проверки: тендерная площадка — отправлено "+fmt(m.rfq)+" КП из "+fmt(qM)+" доступных квот. Проверить фильтры RFQ и шаблон КП.");
  else if(m.resp>2)
    out.push("Требует проверки: время ответа "+(m.respRaw||"выше нормы")+" — проверить регламент и наличие дублёра.");
  else if(!(m.kwa>0))
    out.push("Требует проверки: рекламное продвижение не запущено — уточнить наличие бюджета и приоритетные товары.");
  else if(!isNaN(m.rating) && m.rating<=2)
    out.push("Требует проверки: рейтинг "+pr(m.rating)+" из 5 — сверить товары с PIS ≥ 4,5 и покрытие квот RFQ.");
  else
    out.push("Требует проверки: расхождения между данными кабинета Alibaba.com и показателями отчёта.");

  return out;
}

/* ---------- генерация краткого вывода ---------- */
function genVerdict(){
  const m=metrics(), out=[], q=num(D.rec.quotasMonth)||40;
  const ch=pctChange(m.views,m.viewsPrev);
  if(!isNaN(m.views)){
    if(!isNaN(ch)&&ch!==0)
      out.push((ch>0?"Просмотры выросли":"Просмотры снизились")+" до "+fmt(m.views)+" ("+(ch>0?"+":"\u2212")+String(Math.abs(ch)).replace(".",",")+"% к прошлому месяцу).");
    else
      out.push("Просмотров за месяц \u2014 "+fmt(m.views)+".");
  }
  if(!isNaN(m.inq)){
    if(m.inq>0)
      out.push("Запросов от покупателей \u2014 "+fmt(m.inq)+". Сервис "+(m.resp>2 ? "проседает: среднее время ответа "+m.respRaw+" при целевом \u2264 2 ч." : "отрабатывает в срок ("+(m.respRaw||"в пределах нормы")+")."));
    else
      out.push("Запросов нет при "+(isNaN(m.views)?"нулевых":fmt(m.views))+" просмотрах \u2014 трафик не конвертируется в обращения.");
  }
  if(!isNaN(m.rfq)&&m.rfq<20)
    out.push("Основная точка роста \u2014 тендерная площадка: отправлено "+fmt(m.rfq)+" КП из "+fmt(q)+" доступных квот.");
  else if(!isNaN(m.rating)&&m.rating<=2)
    out.push("Общий рейтинг \u2014 "+fmt(m.rating)+" из 5; ключ к росту \u2014 товарные позиции с PIS \u2265 4,5 ("+(D.rec.pisCurrent||"?")+" из "+(D.rec.pisTarget||"?")+").");
  else if(!(m.kwa>0))
    out.push("Рекламное продвижение не запущено \u2014 без него рейтинг 4\u20135 звёзд недостижим.");
  return out.join(" ");
}
/* ---------- автозаполнение ключевых событий ---------- */
function genEvents(){
  const m=metrics(), out=[];
  const qM=D.rec.quotasMonth||"40", qMin=D.rec.quotasMin||"14";
  /* 1. Реклама: ориентир \u2014 KWA из таблицы */
  if(m.kwa>0)
    out.push(["Расход рекламного бюджета",
      "Израсходовано на рекламу "+mon(m.kwa),
      "Перераспределить бюджет на товары, дающие показы и клики"]);
  else
    out.push(["Рекламное продвижение",
      "Рекламный бюджет не израсходован, кампания не запущена",
      "Запустить продвижение на доступный бюджет: без рекламы 4\u20135 звёзд недостижимо"]);
  /* 2. Низкий рейтинг \u2014 по недостающей метрике */
  if(!isNaN(m.rating) && m.rating<=2){
    const weak=[], steps=[];
    const pisCur=num(D.rec.pisCurrent), pisTgt=num(D.rec.pisTarget)||100;
    if(!isNaN(pisCur) && pisCur<pisTgt){
      weak.push("товарные позиции");
      steps.push("довести товары с PIS \u2265 4,5 до "+pisTgt+" (сейчас "+pisCur+")");
    }
    if(m.resp>2){
      weak.push("сервис");
      steps.push("регламент ответа \u2264 2 ч, Response rate 90\u2013100 %");
    }
    if(!(m.kwa>0)){
      weak.push("маркетинг");
      steps.push("запустить рекламу и работать с квотами RFQ");
    }
    if(!weak.length) weak.push("все три блока (товарные позиции, сервис, маркетинг)");
    out.push(["Повышение рейтинга аккаунта",
      "Рейтинг "+fmt(m.rating)+" из 5 \u2014 проседают: "+weak.join(", "),
      steps.length ? steps.join("; ") : "работать по трём блокам рейтинга одновременно"]);
  }
  /* 3. Мало RFQ \u2014 активная рассылка */
  if(!isNaN(m.rfq) && m.rfq<20)
    out.push(["Активная рассылка КП на тендерной площадке",
      "Отправлено "+fmt(m.rfq)+" из "+qM+" доступных квот RFQ",
      "Отправлять не менее "+qMin+" КП в месяц, реагировать в первые часы"]);
  return out;
}

/* ============================================================
   АВТОГЕНЕРАЦИЯ РЕКОМЕНДАЦИЙ (по базе R1–R8 / P1–P13)
   ============================================================ */
function autoRecs(){
  const out=[], R=D.rec;
  const rows=liveRows(D.dynamics.rows), cards=liveRows(D.summary.cards);
  const row  = re => rows.find(r=>re.test(String(r[0]||""))) || [];
  const card = re => cards.find(c=>re.test(String(c[0]||""))) || [];
  const respRaw = String(row(/response|ответ|реакц/i)[1]||"");
  const resp  = num(respRaw);
  const rfqRow = row(/rfq|кп/i), rfqCard = card(/rfq|кп/i);
  const rfq   = !isNaN(num(rfqRow[1])) ? num(rfqRow[1]) : num(rfqCard[1]);
  const viewRow = row(/view|просмотр/i), viewCard = card(/view|просмотр/i);
  const views = !isNaN(num(viewRow[1])) ? num(viewRow[1]) : num(viewCard[1]);
  const viewsPrev = num(viewRow[2]);
  const inq   = num(row(/inquir|запрос/i)[1]);
  const rating= frac(row(/star|рейтинг|rating/i)[1]);
  const ratingC = frac(card(/star|рейтинг/i)[1]);
  const rate  = isNaN(rating) ? ratingC : rating;
  const kwa   = num(row(/kwa|реклам/i)[1]) || num(card(/kwa/i)[1]);
  const pisCur= num(R.pisCurrent), pisTgt=num(R.pisTarget)||100;
  const qMin=R.quotasMin||"14";
  const exhib=(D.service.rows||[]).find(r=>/выставк/i.test(String(r[0])));

  if(resp > 2)
    out.push(["Настроить регламент ответа на запросы",
      "покупатель уходит к конкуренту, если ответа нет в первые часы (сейчас "+respRaw+" при норме до 2 ч)"]);
  if(!(rfq >= num(qMin)))
    out.push(["Рассылать квоты на тендерной площадке RFQ",
      "каждое КП — потенциальный контракт, а квоты не переносятся на следующий месяц"]);
  if(!isNaN(views) && !isNaN(viewsPrev) && viewsPrev>0 && views<viewsPrev)
    out.push(["Переработать главное фото и заголовки карточек",
      "показы падают — карточка теряет позиции в поисковой выдаче"]);
  if(!isNaN(pisCur) && pisCur < pisTgt)
    out.push(["Наращивать товарные позиции с PIS ≥ 4,5",
      "без них рейтинг не поднимется до 3 звёзд (сейчас "+pisCur+" из "+pisTgt+")"]);
  if(!(kwa > 0))
    out.push(["Запустить рекламное продвижение",
      "без рекламы рейтинг 4–5 звёзд недостижим"]);
  if(!isNaN(views) && views > 0 && !(inq > 0))
    out.push(["Усилить конверсионные элементы карточки",
      "трафик есть, но он не превращается в запросы"]);
  if(exhib && String(exhib[1]).trim()==="−")
    out.push(["Не пропускать онлайн-выставки площадки",
      "выставки дают поток целевых покупателей"]);
  if(!(rate >= 3))
    out.push(["Вести таблицу лидов",
      "обращения теряются без фиксации следующего шага"]);
  return out.length ? out : [["Заходить в аккаунт ежедневно","поддерживать Response rate 90–100 %"]];
}
/* приоритет месяца — первые одно-два действия из списка */
function genPriority(items){
  const list=(items||autoRecs()).slice(0,2);
  if(!list.length) return "";
  const txt=list.map(x=>{ const t=String(x[0]).replace(/\.$/,""); return t.charAt(0).toLowerCase()+t.slice(1); }).join(" и ");
  return txt+".";
}

      <div>
        <div style="font-size:15px;font-style:italic;font-weight:800;margin-bottom:10px">${esc(F.listLbl)}</div>
        <div class="clist">${items.map(i=>`<div>— ${esc(i)}</div>`).join("")}</div>
      </div>
      <div class="qrs">${q("qr1","VK")}${q("qr2",globe)}</div>
    </div>
  </div>`,"plain");
}

/* ============================================================
   СБОРКА ДОКУМЕНТА
   ============================================================ */
function render(){
  const html=[
    sCover(),
    sSummary(),
    sDynamics(),
    sGeo(),
    sService(),
    sRec(),
    sMkt("rfq"),
    sMkt("kwa"),
    sMkt("ads"),
    (D.final && D.final.enabled===false) ? "" : sFinal()
  ].join("");
  const stage=document.getElementById("stage");
  stage.innerHTML=html;
  autoFit();
  fit();
}
function autoFit(){
  document.querySelectorAll("[data-fit]").forEach(el=>{
    const H = parseFloat(el.dataset.h) || 400;
    /* 1. измеряем естественную высоту содержимого */
    el.style.zoom = ""; el.style.height = "auto";
    const nat = el.scrollHeight;
    /* 2. вписываем через zoom, компенсируя высоту, чтобы блок занимал ровно H px */
    if(nat > H + 1){
      const z = Math.max(0.5, Math.min(1, H/nat));
      el.style.zoom = z.toFixed(4);
      el.style.height = (H / z).toFixed(1) + "px";
    }else{
      el.style.height = H + "px";
    }
  });
}
function fit(){
  const pv=document.getElementById("preview");
  const st=document.getElementById("stage"), wr=document.getElementById("stagewrap");
  const s=Math.min(1,(pv.clientWidth-48)/1280);
  st.style.transformOrigin="top left";
  st.style.transform="scale("+s+")";
  st.style.width="1280px";
  wr.style.width=(1280*s)+"px";
  wr.style.height=(st.scrollHeight*s)+"px";
}
window.addEventListener("resize",fit);
renderForm();
render();
</script>
